name: Github Actions Tests

on:
  workflow_call:
    secrets:
      pact_broker_username:
        required: true
      pact_broker_password:
        required: true

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@8597f9957716cb928c22ed66ee0704a24798ce6e

  install-and-compile:
    name: "Install and compile"
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-install-and-compile.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    with:
      has_cypress_tests: true

  tests:
    name: "Unit tests and pacts"
    needs: [ install-and-compile ]
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-unit-tests-and-publish-pacts.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    with:
      publish_pacts: true
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  cypress-tests:
    name: "Cypress"
    needs: [ install-and-compile ]
    uses: govuk-pay/pay-ci/.github/workflows/_run-node-cypress-tests.yml@8597f9957716cb928c22ed66ee0704a24798ce6e

  pact-providers-contract-tests:
    name: "Provider tests"
    needs: tests
    uses: govuk-pay/pay-ci/.github/workflows/_run-provider-pact-tests-for-consumer.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    strategy:
      matrix:
        provider: [ 'connector' ]
    with:
      consumer: "frontend"
      provider: ${{ matrix.provider }}
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa
